<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的電商首頁</title>
<style>
  body { margin:0; font-family: sans-serif; background:#f6f5f3; }
  a { text-decoration:none; color:inherit; }

  /* 漢堡按鈕 */
  .hamburger {
    font-size:30px; cursor:pointer;
    position:fixed; left:20px; top:15px; z-index:1001;
  }

  /* 左側滑出選單 */
  .side-menu {
    height: 100%;
    width: 0;
    position:fixed;
    top:0;
    left:0;
    background:#fff;
    overflow-x:hidden;
    transition:0.3s;
    padding:60px 20px;
    box-shadow:2px 0 5px rgba(0,0,0,0.2);
    z-index:1000;
  }
  .side-menu ul { list-style:none; padding:0; }
  .side-menu li { padding:10px 0; border-bottom:1px solid #eee; cursor:pointer; }
  .side-menu h3 { margin-bottom:20px; }
  .close-btn { position:absolute; top:20px; right:20px; font-size:30px; cursor:pointer; }

  /* Header */
  .main-header {
    background:#fff;
    padding:10px 60px 10px 60px;
    display:flex;
    justify-content:flex-end;
    gap:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
    position:sticky;
    top:0;
    z-index:999;
  }
  .icon-btn img { width:28px; height:28px; vertical-align:middle; }

  /* Hero 輪播圖 */
  .hero { position:relative; width:100%; max-height:500px; overflow:hidden; margin-top:10px; }
  .hero img { width:100%; height:400px; object-fit:cover; display:none; }
  .hero img.active { display:block; }

  /* 商品展示 */
  .products { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; padding:20px; background:#fff; }
  .product-card { width:200px; background:#fafafa; border-radius:10px; padding:10px; text-align:center; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
  .product-card img { width:100%; height:150px; object-fit:cover; border-radius:5px; }
  .product-card h4 { margin:10px 0 5px; font-size:16px; }
  .product-card p { margin:0; color:#333; font-weight:bold; }

  /* Footer */
  footer { background:#333; color:#fff; padding:20px; display:flex; flex-wrap:wrap; gap:20px; justify-content:space-between; }
  footer div { min-width:150px; }
  footer a { color:#fff; display:block; margin:3px 0; }

  /* 社群 icon */
  .social-icons img { width:24px; height:24px; margin-right:8px; }

  /* 浮動按鈕 */
  .floating-btn { position:fixed; right:20px; bottom:20px; background:#00c300; color:#fff; padding:12px 18px; border-radius:50px; font-weight:bold; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.2); }
</style>
</head>
<body>

<!-- 漢堡按鈕 -->
<div class="hamburger" id="hamburger">&#9776;</div>

<!-- 左側滑出選單 -->
<div class="side-menu" id="sideMenu">
  <div class="close-btn" id="closeBtn">&times;</div>
  <h3>商品分類</h3>
  <ul>
    <li>魚1</li>
    <li>魚2</li>
    <li>魚3</li>
    <li>魚4</li>
    <li>魚5</li>
    <li>魚6</li>
    <li>魚7</li>
    <li>魚8</li>
    <li>魚9</li>
    <li>魚10</li>
    <li>魚11</li>
    <li>魚12</li>
    <li>魚13</li>
  </ul>
</div>

<!-- Header -->
<div class="main-header">
  <a href="#" class="icon-btn"><img src="https://files.catbox.moe/j80rom.png" alt="會員登入"></a>
  <a href="#" class="icon-btn"><img src="https://files.catbox.moe/4mscbu.png" alt="購物車"></a>
  <a href="#">商家簡介</a>
  <a href="#">最新消息</a>
</div>

<!-- Hero 輪播圖 -->
<div class="hero">
  <img src="https://picsum.photos/1200/400?random=1" class="active" alt="活動1">
  <img src="https://picsum.photos/1200/400?random=2" alt="活動2">
  <img src="https://picsum.photos/1200/400?random=3" alt="活動3">
</div>

<!-- 商品展示 -->
<div class="products">
  <div class="product-card">
    <img src="https://picsum.photos/200/150?random=11" alt="商品1">
    <h4>魚1</h4>
    <p>$100</p>
  </div>
  <div class="product-card">
    <img src="https://picsum.photos/200/150?random=12" alt="商品2">
    <h4>魚2</h4>
    <p>$120</p>
  </div>
  <div class="product-card">
    <img src="https://picsum.photos/200/150?random=13" alt="商品3">
    <h4>魚3</h4>
    <p>$150</p>
  </div>
</div>

<!-- Footer -->
<footer>
  <div>
    <h4>服務條款</h4>
    <a href="#">條款內容</a>
  </div>
  <div>
    <h4>客戶留言板</h4>
    <a href="#">留言內容</a>
  </div>
  <div>
    <h4>最新消息</h4>
    <a href="#">活動1</a>
    <a href="#">活動2</a>
  </div>
  <div>
    <h4>全部商品</h4>
    <a href="#">魚1</a>
    <a href="#">魚2</a>
  </div>
  <div>
    <h4>會員服務</h4>
    <a href="#">會員中心</a>
    <a href="#">訂購紀錄</a>
  </div>
  <div class="social-icons">
    <h4>社群連結</h4>
    <a href="https://www.facebook.com/你的粉絲專頁" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="FB">
    </a>
    <a href="https://www.instagram.com/你的帳號" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="IG">
    </a>
    <a href="https://goo.gl/maps/你的地點" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/ec/Google_Maps_icon.svg" alt="地圖">
    </a>
  </div>
</footer>

<!-- 浮動聯絡按鈕 -->
<a href="https://line.me/ti/p/~你的LineID" target="_blank" class="floating-btn">聯絡我們</a>

<script>
  // Hero 輪播圖
  const heroImages = document.querySelectorAll('.hero img');
  let current = 0;
  setInterval(() => {
    heroImages[current].classList.remove('active');
    current = (current + 1) % heroImages.length;
    heroImages[current].classList.add('active');
  }, 5000); // 每5秒換圖

  // 漢堡選單控制
  const hamburger = document.getElementById('hamburger');
  const sideMenu = document.getElementById('sideMenu');
  const closeBtn = document.getElementById('closeBtn');

  hamburger.addEventListener('click', () => {
    sideMenu.style.width = '250px';
  });

  closeBtn.addEventListener('click', () => {
    sideMenu.style.width = '0';
  });

  // 點擊遮罩以外區域關閉選單 (可選)
  window.addEventListener('click', (e) => {
    if(!sideMenu.contains(e.target) && !hamburger.contains(e.target)){
      sideMenu.style.width = '0';
    }
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fish</title>
<style>
  body { margin:0; font-family: sans-serif; background:#f6f5f3; }
  a { text-decoration:none; color:inherit; }

  /* Header */
  .main-header {
    background:#fff;
    padding:10px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
    position:sticky;
    top:0;
    z-index:999;
  }
  .header-left { display:flex; align-items:center; gap:15px; }
  .header-right { display:flex; align-items:center; gap:20px; }

  /* 下拉選單 */
  .dropdown { position: relative; }
  .drop-btn {
    background:none;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
    font-size:16px;
    font-weight:bold;
    position:relative;
  }
  .drop-btn img {
    width:28px;
    height:28px;
    object-fit:contain;
  }
  .drop-btn::after {
    content: '▼';
    font-size:12px;
    margin-left:5px;
    transition: transform 0.3s;
  }
  .drop-btn.active::after {
    transform: rotate(180deg);
  }

  .drop-menu {
    position: absolute;
    top:40px;
    left:0;
    background:#fff;
    border:1px solid #ddd;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
    width:200px;
    display:none;
    opacity:0;
    transform:translateY(-10px);
    transition: all 0.3s ease;
    z-index:1000;
    overflow:hidden;
  }
  .drop-menu.show {
    display:block;
    opacity:1;
    transform:translateY(0);
  }
  .drop-menu ul { list-style:none; margin:0; padding:10px 0; }
  .drop-menu ul li a {
    display:block;
    padding:8px 15px;
    color:#333;
    text-decoration:none;
    transition: background 0.2s, color 0.2s;
  }
  .drop-menu ul li a:hover {
    background:#00c300;
    color:#fff;
  }

  /* 輪播圖 */
  .hero { position:relative; width:100%; max-height:500px; overflow:hidden; margin-top:10px; }
  .hero img { width:100%; height:400px; object-fit:cover; display:none; }
  .hero img.active { display:block; }

  /* 商品展示 */
  .products { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; padding:20px; background:#fff; }
  .product-card { width:200px; background:#fafafa; border-radius:10px; padding:10px; text-align:center; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
  .product-card img { width:100%; height:150px; object-fit:cover; border-radius:5px; }
  .product-card h4 { margin:10px 0 5px; font-size:16px; }
  .product-card p { margin:0; color:#333; font-weight:bold; }

  /* Footer */
  footer {
    background:#333;
    color:#fff;
    padding:20px;
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:space-between;
  }
  footer div { min-width:150px; text-align:left; }
  footer h4 { margin-bottom:5px; }
  footer a { color:#fff; display:block; margin:3px 0; }

  /* 社群 icon */
  .social-icons { text-align:left; }
  .social-icons a { display:inline-block; margin-right:10px; }
  .social-icons h4 { margin-bottom:5px; }
  .social-icons a img {
  width:24px;  
  height:24px;
  vertical-align:middle;
}


  /* floating button */
  .floating-btn {
    position:fixed;
    right:20px;
    bottom:100px; /* 往上移 */
    background:#00c300;
    color:#fff;
    padding:12px 20px;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 8px rgba(0,0,0,0.3);
    transition: background 0.3s, transform 0.2s;
  }
  .floating-btn:hover {
    background:#009900;
    transform: translateY(-2px);
  }

  @media(max-width:768px){
    .main-header { flex-wrap:wrap; padding:10px; }
    .header-left { flex-wrap:wrap; gap:10px; }
  }
</style>
</head>
<body>

  <img src="https://files.catbox.moe/zgeugh.png" style="width:20px; height:20px; vertical-align:middle; margin-right:5px;">

<script>
  //  輪播圖
  const heroImages = document.querySelectorAll('.hero img');
  let current = 0;
  setInterval(() => {
    heroImages[current].classList.remove('active');
    current = (current + 1) % heroImages.length;
    heroImages[current].classList.add('active');
  }, 5000);

  // Header 多下拉選單
  const dropdowns = document.querySelectorAll('.dropdown');
  dropdowns.forEach(drop => {
    const btn = drop.querySelector('.drop-btn');
    const menu = drop.querySelector('.drop-menu');

    btn.addEventListener('click', (e) => {
      e.stopPropagation();

      // 關閉其他下拉
      dropdowns.forEach(d => {
        if(d !== drop) {
          d.querySelector('.drop-menu').classList.remove('show');
          d.querySelector('.drop-btn').classList.remove('active');
        }
      });

      // 切換自己
      menu.classList.toggle('show');
      btn.classList.toggle('active');
    });
  });

  // 點空白收起所有下拉
  document.addEventListener('click', () => {
    dropdowns.forEach(d => {
      d.querySelector('.drop-menu').classList.remove('show');
      d.querySelector('.drop-btn').classList.remove('active');
    });
  });

  // 點下拉內容不收起
  document.querySelectorAll('.drop-menu').forEach(menu => {
    menu.addEventListener('click', e => e.stopPropagation());
  });
</script>

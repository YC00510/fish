<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fish</title>

<style>
body { margin:0; font-family: sans-serif; background:#f6f5f3; }
a { text-decoration:none; color:inherit; }

/* Header */
.main-header {
  background:#fff;
  padding:10px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
  position:sticky;
  top:0;
  z-index:999;
}
.header-left, .header-right {
  display:flex;
  align-items:center;
  gap:15px;
}

/* Home */
.home-btn img {
  width:36px;
  height:36px;
}

/* Dropdown */
.dropdown { position:relative; }
.drop-btn {
  background:none;
  border:none;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
}
.drop-btn::after {
  content:'▼';
  font-size:12px;
  margin-left:5px;
  transition:.3s;
}
.drop-btn.active::after {
  transform:rotate(180deg);
}
.drop-menu {
  position:absolute;
  top:40px;
  left:0;
  background:#fff;
  border:1px solid #ddd;
  border-radius:8px;
  width:200px;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
  display:none;
}
.drop-menu.show { display:block; }
.drop-menu a {
  display:block;
  padding:8px 15px;
}
.drop-menu a:hover {
  background:#00c300;
  color:#fff;
}

/* Search */
.search-box {
  display:flex;
  align-items:center;
  border:1px solid #ddd;
  border-radius:25px;
  overflow:hidden;
  height:36px;
}
.search-box input {
  border:none;
  padding:0 10px;
  outline:none;
}
.search-box button {
  border:none;
  background:#00c300;
  cursor:pointer;
  padding:0 10px;
}
.search-box img { width:20px; }

/* Hero */
.hero img {
  width:100%;
  height:400px;
  object-fit:cover;
  display:none;
}
.hero img.active { display:block; }

/* Products */
.products {
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  justify-content:center;
  padding:20px;
  background:#fff;
}
.product-card {
  width:200px;
  background:#fafafa;
  border-radius:10px;
  padding:10px;
  text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.product-card img {
  width:100%;
  height:150px;
  object-fit:cover;
}

/* Footer */
footer {
  background:#333;
  color:#fff;
  padding:20px;
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  justify-content:space-between;
}
footer a { color:#fff; display:block; margin:3px 0; }
.social-icons img { width:24px; }

/* Floating */
.floating-btn {
  position:fixed;
  right:20px;
  bottom:150px;
  background:#00c300;
  color:#fff;
  padding:12px 20px;
  border-radius:25px;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- Header -->
<div class="main-header">
  <div class="header-left">
    <a href="#" class="home-btn">
      <img src="https://files.catbox.moe/fwiva1.png">
    </a>

    <div class="dropdown">
      <button class="drop-btn">全部商品</button>
      <div class="drop-menu">
        <a href="product1.html">魚1</a>
        <a href="product2.html">魚2</a>
        <a href="product3.html">魚3</a>
      </div>
    </div>

    <div class="dropdown">
      <button class="drop-btn">熱門商品</button>
      <div class="drop-menu">
        <a href="#">熱門A</a>
        <a href="#">熱門B</a>
      </div>
    </div>

    <div class="dropdown">
      <button class="drop-btn">精選魚類</button>
      <div class="drop-menu">
        <a href="#">淡水魚</a>
        <a href="#">海水魚</a>
      </div>
    </div>
  </div>

  <div class="header-right">
    <img src="https://files.catbox.moe/s21b00.png" width="28">
    <img src="https://files.catbox.moe/4mscbu.png" width="28">

    <!-- 搜尋在關於我們左邊 -->
    <div class="search-box">
      <input id="searchInput" placeholder="搜尋商品">
      <button id="searchBtn">
        <img src="https://files.catbox.moe/br4tv3.png">
      </button>
    </div>

    <a href="#">關於我們</a>
    <a href="#">最新消息</a>
  </div>
</div>

<!-- Hero -->
<div class="hero">
  <img src="https://picsum.photos/1200/400?1" class="active">
  <img src="https://picsum.photos/1200/400?2">
</div>

<!-- Products -->
<div class="products">
  <div class="product-card">
    <img src="https://picsum.photos/200/150?11">
    <h4>魚1</h4>
    <p>$100</p>
  </div>
  <div class="product-card">
    <img src="https://picsum.photos/200/150?12">
    <h4>魚2</h4>
    <p>$120</p>
  </div>
</div>

<!-- Footer -->
<footer>
  <div>
    <h4>服務條款</h4>
    <a href="#">條款內容</a>
  </div>
  <div>
    <h4>客戶留言板</h4>
    <a href="#">留言內容</a>
  </div>
  <div>
    <h4>最新消息</h4>
    <a href="#">活動1</a>
    <a href="#">活動2</a>
  </div>
  <div>
    <h4>全部商品</h4>
    <a href="product1.html">魚1</a>
    <a href="product2.html">魚2</a>
  </div>
  <div>
    <h4>會員服務</h4>
    <a href="#">會員中心</a>
    <a href="#">訂購紀錄</a>
  </div>
  <div class="social-icons">
    <h4>社群連結</h4>
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg">
    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg">
  </div>
</footer>

<!-- Floating -->
<a href="#" class="floating-btn">聯絡我們</a>

<script>
/* Dropdown */
const dropdowns=document.querySelectorAll('.dropdown');
dropdowns.forEach(d=>{
  const btn=d.querySelector('.drop-btn');
  const menu=d.querySelector('.drop-menu');
  btn.onclick=e=>{
    e.stopPropagation();
    dropdowns.forEach(x=>{
      if(x!==d){
        x.querySelector('.drop-menu').classList.remove('show');
        x.querySelector('.drop-btn').classList.remove('active');
      }
    });
    btn.classList.toggle('active');
    menu.classList.toggle('show');
  };
});
document.onclick=()=>{
  dropdowns.forEach(d=>{
    d.querySelector('.drop-menu').classList.remove('show');
    d.querySelector('.drop-btn').classList.remove('active');
  });
};

/* Hero */
let i=0;
const imgs=document.querySelectorAll('.hero img');
setInterval(()=>{
  imgs[i].classList.remove('active');
  i=(i+1)%imgs.length;
  imgs[i].classList.add('active');
},5000);

/* Search */
const cards=document.querySelectorAll('.product-card');
searchBtn.onclick=()=>{
  const k=searchInput.value.toLowerCase();
  cards.forEach(c=>{
    c.style.display=c.innerText.toLowerCase().includes(k)?'block':'none';
  });
};
</script>

</body>
</html>

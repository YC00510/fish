<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fish</title>
<style>
  body { margin:0; font-family: sans-serif; background:#f6f5f3; }
  a { text-decoration:none; color:inherit; }

  /* Header */
  .main-header {
    background:#fff;
    padding:10px 60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
    position:sticky;
    top:0;
    z-index:999;
  }
  .header-left { display:flex; align-items:center; gap:15px; position:relative; }
  .header-left button {
    background:none;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
    font-size:16px;
    font-weight:bold;
  }
  .header-right { display:flex; align-items:center; gap:20px; }
  .icon-btn img { width:28px; height:28px; vertical-align:middle; }

  /* Header 下拉選單 */
  .header-menu {
    position: absolute;
    top: 45px;
    left: 0;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    width: 240px;
    display: none; /* 初始隱藏 */
    z-index: 1000;
    overflow: hidden;
    opacity: 0;
    transform: translateY(-10px);
    transition: all 0.3s ease;
  }
  .header-menu.show {
    display: block;
    opacity: 1;
    transform: translateY(0);
  }
  .header-menu ul { list-style: none; margin:0; padding:10px 0; }
  .header-menu ul li a {
    display: block;
    padding: 8px 15px;
    color: #333;
    text-decoration: none;
    transition: background 0.2s, color 0.2s;
  }
  .header-menu ul li a:hover {
    background: #00c300;
    color: #fff;
  }

  /* Hero 輪播圖 */
  .hero { position:relative; width:100%; max-height:500px; overflow:hidden; margin-top:10px; }
  .hero img { width:100%; height:400px; object-fit:cover; display:none; }
  .hero img.active { display:block; }

  /* 商品展示 */
  .products { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; padding:20px; background:#fff; }
  .product-card { width:200px; background:#fafafa; border-radius:10px; padding:10px; text-align:center; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
  .product-card img { width:100%; height:150px; object-fit:cover; border-radius:5px; }
  .product-card h4 { margin:10px 0 5px; font-size:16px; }
  .product-card p { margin:0; color:#333; font-weight:bold; }

  /* Footer */
  footer {
    background:#333;
    color:#fff;
    padding:20px;
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:space-between;
  }
  footer div { min-width:150px; text-align:left; }
  footer h4 { margin-bottom:5px; }
  footer a { color:#fff; display:block; margin:3px 0; }

  /* 社群 icon */
  .social-icons img { width:24px; height:24px; margin-right:8px; }

  /* 浮動按鈕 */
  .floating-btn { position:fixed; right:20px; bottom:20px; background:#00c300; color:#fff; padding:12px 18px; border-radius:50px; font-weight:bold; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.2); }
</style>
</head>
<body>

<!-- Header -->
<div class="main-header">
  <div class="header-left">
    <button id="menuBtn">
      <img src="https://files.catbox.moe/xf1m7y.png" alt="icon" width="24" height="24">
      全部商品
    </button>
    <!-- 下拉選單 -->
    <div class="header-menu" id="headerMenu">
      <ul>
        <li><a href="#">魚1</a></li>

        <li><a href="#">魚11</a></li>
        <li><a href="#">魚12</a></li>
        <li><a href="#">魚13</a></li>
      </ul>
    </div>
  </div>

  <div class="header-left">
  <!-- 全部商品 -->
  <div class="dropdown">
    <button class="drop-btn">
      <img src="https://files.catbox.moe/s21b00.png" alt="icon" width="24" height="24">

        <li><a href="#">魚1</a></li>

  </div>

  <!-- 新增範例：熱門商品 -->

    <button class="drop-btn">
      <img src="https://files.catbox.moe/4mscbu.png" alt="icon" width="24" height="24">

    </button>
    <div class="drop-menu">
      <ul>
        <li><a href="#">熱門1</a></li>

  <!-- 再新增更多按鈕也可以 -->
</div>

  
  <div class="header-right">
    <a href="#" class="icon-btn"><img src="https://files.catbox.moe/s21b00.png" alt="會員登入"></a>
    <a href="#" class="icon-btn"><img src="https://files.catbox.moe/4mscbu.png" alt="購物車"></a>

</div>

  <div>

  </div>
  <div>

  </div>
  <div>

<!-- 浮動聯絡按鈕 -->
<a href="#" class="floating-btn">聯絡我們</a>

<script>
  // Hero 輪播圖
  const heroImages = document.querySelectorAll('.hero img');
  let current = 0;
  setInterval(() => {
    heroImages[current].classList.remove('active');
    current = (current + 1) % heroImages.length;
    heroImages[current].classList.add('active');
  }, 5000);

  // Header 下拉選單
  const menuBtn = document.getElementById('menuBtn');
  const headerMenu = document.getElementById('headerMenu');

  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    headerMenu.classList.toggle('show');
  });

  // 點空白區收起
  document.addEventListener('click', () => {
    headerMenu.classList.remove('show');
  });

  headerMenu.addEventListener('click', (e) => e.stopPropagation());
</script>

</body>
</html>

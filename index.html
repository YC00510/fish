<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fish</title>
<style>
  body { margin:0; font-family: sans-serif; background:#f6f5f3; }
  a { text-decoration:none; color:inherit; }

  /* Header */
  .main-header {
    background:#fff;
    padding:10px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
    position:sticky;
    top:0;
    z-index:999;
  }
  .header-left { display:flex; align-items:center; gap:15px; }
  .header-right { display:flex; align-items:center; gap:15px; }

  /* 回首頁圖示 */
  .home-btn img {
    width:36px;
    height:36px;
    cursor:pointer;
  }

  /* 下拉容器 */
  .dropdown { position: relative; }
  .drop-btn {
    background:none;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
    font-size:16px;
    font-weight:bold;
  }
  .drop-btn img {
    width:28px;
    height:28px;
    object-fit:contain;
  }
  .drop-btn::after {
    content: '▼';
    font-size:12px;
    margin-left:5px;
    transition: transform 0.3s;
  }
  .drop-btn.active::after {
    transform: rotate(180deg);
  }
  .drop-menu {
    position: absolute;
    top:40px;
    left:0;
    background:#fff;
    border:1px solid #ddd;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
    width:200px;
    display:none;
    opacity:0;
    transform:translateY(-10px);
    transition: all 0.3s ease;
    z-index:1000;
    overflow:hidden;
  }
  .drop-menu.show {
    display:block;
    opacity:1;
    transform:translateY(0);
  }
  .drop-menu ul { list-style:none; margin:0; padding:10px 0; }
  .drop-menu ul li a {
    display:block;
    padding:8px 15px;
    color:#333;
  }
  .drop-menu ul li a:hover { background:#00c300; color:#fff; }

  /* 搜尋框 */
  .search-box {
    display:flex;
    align-items:center;
    border:1px solid #ddd;
    border-radius:25px;
    overflow:hidden;
    height:36px;
  }
  .search-box input {
    border:none;
    padding:0 10px;
    outline:none;
    height:100%;
    font-size:14px;
  }
  .search-box button {
    border:none;
    background:#00c300;
    cursor:pointer;
    height:100%;
    padding:0 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background 0.3s;
  }
  .search-box button:hover { background:#009900; }
  .search-box img { width:20px; height:20px; }

  /* Hero 輪播圖 */
  .hero { position:relative; width:100%; max-height:500px; overflow:hidden; margin-top:10px; }
  .hero img { width:100%; height:400px; object-fit:cover; display:none; }
  .hero img.active { display:block; }

  /* 商品展示 */
  .products { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; padding:20px; background:#fff; }
  .product-card { width:200px; background:#fafafa; border-radius:10px; padding:10px; text-align:center; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
  .product-card img { width:100%; height:150px; object-fit:cover; border-radius:5px; }
  .product-card h4 { margin:10px 0 5px; font-size:16px; }
  .product-card p { margin:0; color:#333; font-weight:bold; }

  /* Footer */
  footer { background:#333; color:#fff; padding:20px; display:flex; flex-wrap:wrap; gap:20px; justify-content:space-between; }
  footer div { min-width:150px; text-align:left; }
  footer h4 { margin-bottom:5px; }
  footer a { color:#fff; display:block; margin:3px 0; }
  .social-icons { text-align:left; }
  .social-icons a { display:inline-block; margin-right:10px; }
    /* 社群 icon */
  .social-icons a img { width:24px; height:24px; vertical-align:middle; }

  /* 浮動按鈕 */
  .floating-btn {
    position:fixed;
    right:20px;
    bottom:60px;
    background:#00c300;
    color:#fff;
    padding:12px 20px;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 8px rgba(0,0,0,0.3);
    transition: background 0.3s, transform 0.2s;
  }
  .floating-btn:hover { background:#009900; transform: translateY(-2px); }
</style>
</head>
<body>

<!-- Header -->
<div class="main-header">

    <a href="#" class="home-btn"><img src="https://files.catbox.moe/xf1m7y.png" alt="首頁"></a>

    <!-- 全部商品下拉 -->
    <div class="dropdown">
      <button class="drop-btn">

        <img src="https://files.catbox.moe/xf1m7y.png" alt="icon"> 熱門商品
      </button>
      <div class="drop-menu">
        <ul>
          <li><a href="product1.html">魚1</a></li>

        </ul>
      </div>
    </div>
  </div>

  <div class="header-right">
    <a href="#" class="icon-btn"><img src="https://files.catbox.moe/s21b00.png" alt="會員登入" width="28" height="28"></a>
    <a href="#" class="icon-btn"><img src="https://files.catbox.moe/4mscbu.png" alt="購物車" width="28" height="28"></a>

</div>

<!-- Hero 輪播圖 -->
<div class="hero">
  <img src="https://picsum.photos/1200/400?random=1" class="active" alt="活動1">
  <img src="https://picsum.photos/1200/400?random=2" alt="活動2">

<!-- Footer -->
<footer>
  <div>
    <h4>服務條款</h4>

  </div>
  <div>
    <h4>客戶留言板</h4>

  <div>

  <div class="social-icons">
    <h4>社群連結</h4>
    <a href="#"><img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="FB"></a>
    <a href="#"><img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="IG"></a>
    <a href="#"><img src="https://files.catbox.moe/x94k3b.png" alt="地圖"></a>
  </div>
</footer>

<!-- 浮動聯絡按鈕 -->
<a href="#" class="floating-btn">聯絡我們</a>

<script>
  // Hero 輪播圖
  const heroImages = document.querySelectorAll('.hero img');
  let current = 0;
  setInterval(() => {
    heroImages[current].classList.remove('active');
    current = (current + 1) % heroImages.length;
    heroImages[current].classList.add('active');
  }, 5000);

  // 下拉選單
  const dropdowns = document.querySelectorAll('.dropdown');
  dropdowns.forEach(drop => {
    const btn = drop.querySelector('.drop-btn');
    const menu = drop.querySelector('.drop-menu');

    btn.addEventListener('click', e => {
      e.stopPropagation();
      dropdowns.forEach(d => {
        if(d !== drop){
          d.querySelector('.drop-menu').classList.remove('show');
          d.querySelector('.drop-btn').classList.remove('active');
        }
      });
      menu.classList.toggle('show');
      btn.classList.toggle('active');
    });
  });
  document.addEventListener('click', () => {
    dropdowns.forEach(d => {
      d.querySelector('.drop-menu').classList.remove('show');
      d.querySelector('.drop-btn').classList.remove('active');
    });
  });
  document.querySelectorAll('.drop-menu').forEach(menu => {
    menu.addEventListener('click', e => e.stopPropagation());
  });

  // 商品搜尋（同一頁過濾 + 清空恢復）
  const products = document.querySelectorAll('.product-card');
  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');

  function filterProducts() {
    const keyword = searchInput.value.trim().toLowerCase();
    products.forEach(card => {
      const title = card.querySelector('h4').textContent.toLowerCase();
      card.style.display = keyword === '' || title.includes(keyword) ? 'block' : 'none';
    });
  }

  searchBtn.addEventListener('click', filterProducts);
  searchInput.addEventListener('keyup', filterProducts); // 即時搜尋
</script>
</body>
</html>

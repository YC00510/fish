<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魚市集</title>
<link rel="icon" href="https://files.catbox.moe/fwiva1.png" type="image/png">

<style>
/* 全域 */
body { margin:0; font-family: 'Noto Sans', sans-serif; background:#f6f5f3; }
a { text-decoration:none; color:inherit; }

/* Header */
.main-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  padding:10px 20px;
  background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
  position:sticky;
  top:0;
  z-index:999;
  border-bottom-left-radius:15px;
  border-bottom-right-radius:15px;
  flex-wrap: wrap;
}
.header-left, .header-center, .header-right { display:flex; align-items:center; gap:15px; }
.header-center { flex:1; justify-content:center; margin:5px 0; }
.home-btn img { width:36px; height:36px; cursor:pointer; }

/* Dropdown */
.dropdown { position: relative; }
.drop-btn {
  background:none; border:none; cursor:pointer; display:flex; align-items:center; gap:5px;
  font-size:16px; font-weight:bold;
}
.drop-btn img { width:28px; height:28px; object-fit:contain; }
.drop-btn::after { content:'▼'; font-size:12px; margin-left:5px; transition: transform 0.3s; }
.drop-btn.active::after { transform: rotate(180deg); }
.drop-menu {
  position:absolute; top:40px; left:0; background:#fff; border:1px solid #ddd; border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,0.2); width:200px; display:none; opacity:0;
  transform:translateY(-10px); transition: all 0.3s ease; z-index:1000; overflow:hidden;
}
.drop-menu.show { display:block; opacity:1; transform:translateY(0); }
.drop-menu ul { list-style:none; margin:0; padding:10px 0; }
.drop-menu ul li a { display:block; padding:8px 15px; color:#333; }
.drop-menu ul li a:hover { background:#00c300; color:#fff; }

/* 搜尋框 */
.search-box { display:flex; align-items:center; border:1px solid #ddd; border-radius:25px; overflow:hidden; height:36px; }
.search-box input { border:none; padding:0 10px; outline:none; height:100%; font-size:14px; }
.search-box button { border:none; background:#d1e0e0; cursor:pointer; height:100%; padding:0 10px; display:flex; align-items:center; justify-content:center; transition: background 0.3s; }
.search-box button:hover { background:#004d4d; }
.search-box img { width:20px; height:20px; }

/* Header 右側 */
.header-right { display: flex; align-items: center; gap: 10px; }
.header-right a { margin-left: 0; }

/* Hero 輪播圖 */
.hero {
  width:100%;
  max-width:1200px;
  margin:30px auto;
  position:relative;
  overflow:hidden;
  border-radius:30px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.hero img { width:100%; height:100%; object-fit:cover; display:none; }
.hero img.active { display:block; }
.hero .arrow {
  position:absolute; top:50%; transform:translateY(-50%);
  font-size:30px; color:white; background:rgba(0,0,0,0.3);
  border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.hero .arrow.left { left:10px; }
.hero .arrow.right { right:10px; }

/* 商品展示 */
.products-title { text-align:center; font-size:24px; font-weight:bold; margin:20px 0 10px; color:#4da6ff; }
.products { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; padding:20px; background:#fff; }
.product-card { width:200px; background:#fafafa; border-radius:10px; padding:10px; text-align:center; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
.product-card img { width:100%; height:150px; object-fit:cover; border-radius:5px; }
.product-card h4 { margin:10px 0 5px; font-size:16px; }
.product-card p { margin:0; color:#333; font-weight:bold; }

/* Footer */
footer { background:#333; color:#fff; padding:20px; display:flex; flex-wrap:wrap; gap:20px; justify-content:space-between; }
footer div { min-width:150px; text-align:left; }
footer h4 { margin-bottom:5px; }
footer a { color:#fff; display:block; margin:3px 0; }
.social-icons a { display:inline-block; margin-right:10px; }
.social-icons a img { width:24px; height:24px; vertical-align:middle; }

/* 浮動按鈕 */
.floating-btn {
  position:fixed; right:20px; bottom:150px; background:#00c300; color:#fff;
  padding:12px 20px; border-radius:25px; font-weight:bold; cursor:pointer;
  box-shadow:0 4px 8px rgba(0,0,0,0.3); transition: background 0.3s, transform 0.2s;
}
.floating-btn:hover { background:#009900; transform: translateY(-2px); }

/* 響應式 */
@media (max-width: 768px) {
  .floating-btn { right:16px; bottom:80px; padding:14px 18px; font-size:14px; }
  .hero { height:200px; border-radius:10px; }
  .hero img { object-fit:cover; }
}

/* 手機版 Header */
.menu-toggle { display:none; font-size:26px; background:none; border:none; cursor:pointer; }
.mobile-menu {
  max-height:0; overflow:hidden; background:#fff; padding:0 15px;
  box-shadow:0 4px 10px rgba(0,0,0,0.15); transition:max-height 0.3s ease,padding 0.3s ease;
}
.mobile-menu.show { max-height:500px; padding:15px; }
.mobile-menu a { display:block; padding:10px 0; border-bottom:1px solid #eee; font-weight:bold; }

/* 手機隱藏桌面元素 */
@media (max-width: 768px) {
  .header-left .dropdown, .header-center { display:none; }
  .menu-toggle { display:block; }
}

/* 顯示切換 */
.desktop-only { display:block; }
.mobile-only { display:none; }
@media (max-width: 768px) {
  .desktop-only { display:none; }
  .mobile-only { display:block; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="main-header">
  <div class="header-left">
    <a href="#" class="home-btn"><img src="https://files.catbox.moe/fwiva1.png" alt="首頁"></a>
    <div class="dropdown">
      <button class="drop-btn"><img src="https://files.catbox.moe/xf1m7y.png"> 全部商品</button>
      <div class="drop-menu"><ul><li><a href="#">魚1</a></li><li><a href="#">魚2</a></li></ul></div>
    </div>
    <div class="dropdown">
      <button class="drop-btn"><img src="https://files.catbox.moe/xf1m7y.png"> 熱門商品</button>
      <div class="drop-menu"><ul><li><a href="#">人氣魚</a></li><li><a href="#">熱賣魚種</a></li></ul></div>
    </div>
    <div class="dropdown">
      <button class="drop-btn"><img src="https://files.catbox.moe/xf1m7y.png"> 精選魚類</button>
      <div class="drop-menu"><ul><li><a href="#">淡水魚</a></li><li><a href="#">海水魚</a></li></ul></div>
    </div>
  </div>

  <div class="header-right">
    <button class="menu-toggle">☰</button>
    <div class="search-box">
      <input type="text" placeholder="想找什麼呢?" id="searchInput">
      <button id="searchBtn"><img src="https://files.catbox.moe/br4tv3.png" alt="搜尋"></button>
    </div>
    <a href="#"><img src="https://files.catbox.moe/s21b00.png" alt="會員登入"></a>
    <a href="#"><img src="https://files.catbox.moe/4mscbu.png" alt="購物車"></a>
  </div>
</div>

<div class="mobile-menu">
  <a href="#">全部商品</a>
  <a href="#">熱門商品</a>
  <a href="#">精選魚類</a>
</div>

<!-- 輪播圖 -->
<div class="hero desktop-only">
  <img src="https://files.catbox.moe/ytn72p.png" class="active">
  <img src="https://files.catbox.moe/94fwk9.png">
  <div class="arrow left">&#10094;</div>
  <div class="arrow right">&#10095;</div>
</div>

<div class="hero mobile-only">
  <img src="https://files.catbox.moe/gazxu2.jpg" class="active">
  <img src="https://files.catbox.moe/zbun2i.jpg">
  <div class="arrow left">&#10094;</div>
  <div class="arrow right">&#10095;</div>
</div>

<!-- 商品展示 -->
<h2 class="products-title">熱銷魚種</h2>
<div class="products">
  <div class="product-card"><a href="#"><img src="https://picsum.photos/200/150?random=11" alt="商品1"><h4>魚1</h4><p>$100</p></a></div>
  <div class="product-card"><a href="#"><img src="https://picsum.photos/200/150?random=12" alt="商品2"><h4>魚2</h4><p>$120</p></a></div>
  <div class="product-card"><a href="#"><img src="https://picsum.photos/200/150?random=13" alt="商品3"><h4>魚3</h4><p>$150</p></a></div>
  <div class="product-card"><a href="#"><img src="https://picsum.photos/200/150?random=14" alt="商品4"><h4>魚4</h4><p>$180</p></a></div>
</div>

<!-- Footer -->
<footer>
  <div><h4>服務條款</h4><a href="#">條款內容</a><a href="#">關於我們</a></div>
  <div><h4>客戶留言板</h4><a href="#">留言內容</a></div>
  <div><h4>最新消息</h4><a href="#">活動1</a><a href="#">活動2</a></div>
  <div><h4>全部商品</h4><a href="#">魚1</a><a href="#">魚2</a></div>
  <div><h4>會員服務</h4><a href="#">會員中心</a><a href="#">訂購紀錄</a></div>
  <div class="social-icons"><h4>社群連結</h4>
    <a href="#"><img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="FB"></a>
    <a href="#"><img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="IG"></a>
    <a href="#"><img src="https://files.catbox.moe/x94k3b.png" alt="地圖"></a>
  </div>
</footer>

<!-- 浮動聯絡按鈕 -->
<a href="#" class="floating-btn"><img src="https://files.catbox.moe/zgeugh.png" alt="聯絡" style="width:20px; vertical-align:middle; margin-right:6px;">聯絡我們</a>

<script>
// 輪播圖
document.querySelectorAll('.hero').forEach(hero => {
  if (hero.offsetParent === null) return;
  const imgs = hero.querySelectorAll('img');
  const leftArrow = hero.querySelector('.arrow.left');
  const rightArrow = hero.querySelector('.arrow.right');
  let index = 0;
  let interval = setInterval(nextSlide, 3000);

  function showSlide(i){
    imgs.forEach(img => img.classList.remove('active'));
    imgs[i].classList.add('active');
  }
  function nextSlide(){ index = (index+1)%imgs.length; showSlide(index); }
  function prevSlide(){ index = (index-1+imgs.length)%imgs.length; showSlide(index); }
  if(leftArrow) leftArrow.addEventListener('click',()=>{ prevSlide(); resetInterval(); });
  if(rightArrow) rightArrow.addEventListener('click',()=>{ nextSlide(); resetInterval(); });
  function resetInterval(){ clearInterval(interval); interval=setInterval(nextSlide,3000); }
});

// Dropdown
const dropdowns=document.querySelectorAll('.dropdown');
dropdowns.forEach(drop=>{
  const btn=drop.querySelector('.drop-btn'); 
  const menu=drop.querySelector('.drop-menu');
  btn.addEventListener('click', e=>{
    e.stopPropagation();
    dropdowns.forEach(d=>{ if(d!==drop){ d.querySelector('.drop-menu').classList.remove('show'); d.querySelector('.drop-btn').classList.remove('active'); }});
    menu.classList.toggle('show'); btn.classList.toggle('active');
  });
});
document.addEventListener('click', ()=>{ dropdowns.forEach(d=>{ d.querySelector('.drop-menu').classList.remove('show'); d.querySelector('.drop-btn').classList.remove('active'); }); });

// 商品搜尋
const products=document.querySelectorAll('.product-card');
const searchInput=document.getElementById('searchInput');
const searchBtn=document.getElementById('searchBtn');
function filterProducts(){
  const keyword=searchInput.value.trim().toLowerCase();
  products.forEach(card=>{
    const title=card.querySelector('h4').textContent.toLowerCase();
    card.style.display=(keyword===''||title.includes(keyword))?'block':'none';
  });
}
searchBtn.addEventListener('click', filterProducts);
searchInput.addEventListener('keyup', filterProducts);

// 手機選單
const toggleBtn=document.querySelector('.menu-toggle');
const mobileMenu=document.querySelector('.mobile-menu');
toggleBtn.addEventListener('click',()=>{ mobileMenu.classList.toggle('show'); });
</script>

</body>
</html>
